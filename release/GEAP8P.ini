# The European game (GEAP8P), as GEAE8P.ini. Skip the SDK scheduler idle spin in SelectThread (lwz/cmplwi/beq on RunQueueBits).
# Dual core (as on Android): the GPU thread takes the FIFO and the 60 fps in-between pictures.
# The end-of-frame wait (fn_801DC420 in the USA game: pump the file loader, poll VIGetRetraceCount
# until the next retrace) skips to the next event while the retrace count hasn't moved and the
# loader queue is empty.
[Core]
StaticRecompWaitPC = 0x801DE124
StaticRecompWaitCounter = 0x8034B13C
StaticRecompWaitLast = 0x8034ADB0
StaticRecompWaitEmpty = 0x8034A8E0
StaticRecompIdlePC = 0x8023B02C
CPUThread = True

# Build validation for Skies of Arcadia Legends: Recompiled -- Windows, Linux and Android.
#
# On a push this is validation only: nothing is signed or published; each job uploads a short-lived
# artifact so a build can be inspected. release.yml CALLS this workflow (workflow_call,
# `release: true`) so a tagged release is built by exactly these steps: Windows packages the zip
# under the tag's version, Linux the tar.gz, and Android builds a SIGNED, minified release APK.
#
# NO GAME FILES LEAVE THE CODEGEN JOB. The game's main.dol (and the PGO profiles, which are
# game-derived) live in a private secrets repo, cloned with a read-only token in the codegen job
# only and deleted right after. tools/ci-codegen.sh patches the DOL, runs DolRecomp for both
# targets (x86_64 Windows and Linux, aarch64 Android), precomputes each module's tables (so the build jobs never need the DOL:
# -DMODULE_TABLES_INC) and refuses to finish if a DOL ended up in its output. The generated code is
# game-derived too, so it travels between jobs encrypted (SOAL_ARTIFACT_KEY): for one day within a
# run, and for 30 days under its cache key so a release tag reuses what validate made for its commit.
#
# Required secrets:
#   SOAL_SECRETS_REPO_WITH_PAT -> https://x-access-token:<PAT>@github.com/<owner>/<secrets repo>.git
#       holding main.dol (the ORIGINAL USA DOL), main-eu.dol (the ORIGINAL European DOL; SHA-256s
#       below) and pgo/windows.profdata, pgo/android.profdata (optionally pgo/windows-eu.profdata,
#       pgo/android-eu.profdata) at its root
#   SOAL_ARTIFACT_KEY          -> any long random string (encrypts the codegen artifact)
#   RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_PASSWORD, RELEASE_KEY_ALIAS
#       -> release signing (tools/make-release-key.sh); release mode only, and only in the
#          android-sign job (the android job builds the APK unsigned)
#
# Fork PRs cannot run this: push + workflow_dispatch only, so the secrets are never in scope for
# unmerged code.

name: validate

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      vname:      # the tag minus its leading v (0.9.0-beta)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      unsigned_release:   # try the release APK build (unsigned, no signing secrets) without a tag
        type: boolean
        default: false
  # main is only ever fast-forwarded to a dev commit this already passed (tools/release.sh), and the
  # tag's release run builds it again, so a push to main isn't validated a second time
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
      - '.gitignore'

permissions:
  contents: read

env:
  DOL_SHA256: 87c240acb746c5a09e95dd84021f78643eaa6721d8edc96ed87d3b6b3bcbae54
  # The European disc (GEAP8P): its original main.dol is main-eu.dol in the secrets repo
  DOL_SHA256_EU: d0e9fc91bd477d5cf1da24261de4c606893979ada0a7fef3c741c0c2470d96c3
  # Both games in every package: one release takes either disc (tools/ci-codegen.sh, the
  # build-release scripts and tools/android-ws-build.sh read it)
  REGIONS: us eu
  LLVM_VERSION: 20.1.8
  # Ubuntu 26.04's own build (the release pocket, signed by Ubuntu), the one the shipped codegen was
  # made with locally; apt refuses if it's gone rather than installing another
  LLVM_APT_VERSION: 1:20.1.8-2ubuntu8
  # GitHub's published digest of the release asset
  LLVM_WINDOWS_SHA256: f229769f11d6a6edc8ada599c0cda964b7dee6ab1a08c6cf9dd7f513e85b107f

jobs:
  # ---------------------------------------------------------------------------
  codegen:
    name: codegen
    environment: ci
    runs-on: ubuntu-26.04  # LLVM 20.1.8 in its own archive
    permissions:
      contents: read
      actions: read   # earlier runs' codegen artifacts
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Only what DolRecomp and the patches need (not Dolphin's externals)
      - name: Submodules (ModernGekko, RecompCore, DolRecomp)
        run: |
          git submodule update --init --depth 1 lib/ModernGekko
          git -C lib/ModernGekko submodule update --init --depth 1 vendor/dolphin
          git -C lib/ModernGekko/vendor/dolphin submodule update --init --depth 1 DolRecomp

      - name: Apply patches
        run: tools/apply-patches.sh

      # Codegen takes ~2 hours, and most changes (the frontend, the launchers, the Android app) don't
      # touch it. The ENCRYPTED artifact is cached under a key made of everything the generated code
      # depends on: the DOL patch, DolRecomp (pin + patches), the table generator, LLVM, the codegen
      # script, the secrets repo's commit (DOL, profiles) and which artifact key encrypted it.
      - name: Codegen cache key
        id: key
        env:
          SECRETS_URL: ${{ secrets.SOAL_SECRETS_REPO_WITH_PAT }}
          SOAL_ARTIFACT_KEY: ${{ secrets.SOAL_ARTIFACT_KEY }}
        run: |
          test -n "$SECRETS_URL" || { echo "::error::SOAL_SECRETS_REPO_WITH_PAT is not set"; exit 1; }
          test -n "$SOAL_ARTIFACT_KEY" || { echo "::error::SOAL_ARTIFACT_KEY is not set"; exit 1; }
          REST=${SECRETS_URL#https://}
          AUTH=$(printf '%s' "${REST%%@*}" | base64 -w0)
          echo "::add-mask::$AUTH"
          INPUTS=$(GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" git ls-remote "https://${REST#*@}" HEAD | cut -c1-40)
          test ${#INPUTS} = 40 || { echo "::error::Can't read the secrets repo's commit"; exit 1; }
          D=lib/ModernGekko/vendor/dolphin
          # The repository files the output depends on: tools/ci-codegen.sh lists them (CACHE_INPUTS)
          FILES=$(sed -n 's/^# CACHE_INPUTS: //p' tools/ci-codegen.sh)
          test -n "$FILES" || { echo "::error::tools/ci-codegen.sh has no CACHE_INPUTS line"; exit 1; }
          KEY=$( { echo "$INPUTS" "$LLVM_APT_VERSION" "$REGIONS"; git -C "$D" rev-parse HEAD:DolRecomp
                   printf '%s' "$SOAL_ARTIFACT_KEY" | sha256sum
                   sha256sum $FILES; } | sha256sum | cut -c1-32)
          echo "key=codegen-$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore codegen
        id: cached
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: codegen.tar.gz.enc
          key: ${{ steps.key.outputs.key }}

      # Caches belong to one branch or tag, so a release tag never saw the codegen dev's run made
      # for the same commit and generated it again (~55 min). Artifacts belong to none: each key's
      # codegen is also kept as an artifact named by the key (30 days), and a cache miss takes it
      # from there. It only decrypts with SOAL_ARTIFACT_KEY (its digest is in the key), so one that
      # does was made by this repo's workflows.
      - name: Find earlier codegen
        id: earlier
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.key.outputs.key }}
        run: |
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "earlier artifact for $NAME: ${ID:-none}"

      - name: Reuse earlier codegen
        id: reused
        if: steps.cached.outputs.cache-hit != 'true' && steps.earlier.outputs.id != ''
        shell: bash  # -o pipefail: a stream that doesn't decrypt mustn't pass as one that does
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ steps.earlier.outputs.id }}
          SOAL_ARTIFACT_KEY: ${{ secrets.SOAL_ARTIFACT_KEY }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > "$RUNNER_TEMP/codegen.zip"
          unzip -o -q "$RUNNER_TEMP/codegen.zip" codegen.tar.gz.enc
          rm -f "$RUNNER_TEMP/codegen.zip"
          if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SOAL_ARTIFACT_KEY -in codegen.tar.gz.enc \
              | tar tzf - > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm -f codegen.tar.gz.enc
            echo "::warning::Artifact $ID doesn't decrypt; generating the code instead."
          fi

      - name: Install LLVM ${{ env.LLVM_VERSION }}
        if: steps.cached.outputs.cache-hit != 'true' && steps.reused.outputs.found != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y "llvm-20-dev=$LLVM_APT_VERSION" ninja-build
          test "$(llvm-config-20 --version)" = "$LLVM_VERSION" \
            || { echo "::error::llvm-config-20 says $(llvm-config-20 --version), not $LLVM_VERSION"; exit 1; }

      - name: Build DolRecomp
        if: steps.cached.outputs.cache-hit != 'true' && steps.reused.outputs.found != 'true'
        run: |
          cmake -S lib/ModernGekko/vendor/dolphin/DolRecomp -B build/dolrecomp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DDOLRECOMP_ENABLE_LLVM=ON -DLLVM_DIR=/usr/lib/llvm-20/lib/cmake/llvm
          cmake --build build/dolrecomp --target dolrecomp

      - name: Fetch private build inputs (DOL, profiles)
        if: steps.cached.outputs.cache-hit != 'true' && steps.reused.outputs.found != 'true'
        env:
          SECRETS_URL: ${{ secrets.SOAL_SECRETS_REPO_WITH_PAT }}
        run: |
          test -n "$SECRETS_URL" || { echo "::error::SOAL_SECRETS_REPO_WITH_PAT is not set"; exit 1; }
          # The token goes to git as an HTTP header through the environment: not in git's
          # arguments (visible to other processes) and not in the clone's .git/config
          REST=${SECRETS_URL#https://}
          AUTH=$(printf '%s' "${REST%%@*}" | base64 -w0)
          echo "::add-mask::$AUTH"
          GIT_TERMINAL_PROMPT=0 GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            git clone -q --depth 1 "https://${REST#*@}" "$RUNNER_TEMP/s"
          mkdir -p "$RUNNER_TEMP/secrets/pgo"
          cp "$RUNNER_TEMP/s/main.dol" "$RUNNER_TEMP/s/main-eu.dol" "$RUNNER_TEMP/secrets/"
          cp "$RUNNER_TEMP/s/pgo/windows.profdata" "$RUNNER_TEMP/s/pgo/android.profdata" "$RUNNER_TEMP/secrets/pgo/"
          # European profiles are optional: without one that region is built without PGO
          for f in windows-eu android-eu; do
            if [ -f "$RUNNER_TEMP/s/pgo/$f.profdata" ]; then cp "$RUNNER_TEMP/s/pgo/$f.profdata" "$RUNNER_TEMP/secrets/pgo/"; fi
          done
          rm -rf "$RUNNER_TEMP/s"
          echo "$DOL_SHA256  $RUNNER_TEMP/secrets/main.dol" | sha256sum -c --quiet -
          echo "$DOL_SHA256_EU  $RUNNER_TEMP/secrets/main-eu.dol" | sha256sum -c --quiet -

      - name: Generate code
        if: steps.cached.outputs.cache-hit != 'true' && steps.reused.outputs.found != 'true'
        run: DOLRECOMP=build/dolrecomp/dolrecomp tools/ci-codegen.sh "$RUNNER_TEMP/secrets" codegen

      - name: Delete the private inputs
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets" "$RUNNER_TEMP/s"

      - name: Encrypt codegen
        if: steps.cached.outputs.cache-hit != 'true' && steps.reused.outputs.found != 'true'
        shell: bash  # -o pipefail: a failed tar mustn't encrypt a cut-short stream
        env:
          SOAL_ARTIFACT_KEY: ${{ secrets.SOAL_ARTIFACT_KEY }}
        run: |
          test -n "$SOAL_ARTIFACT_KEY" || { echo "::error::SOAL_ARTIFACT_KEY is not set; refusing to upload game code in the clear."; exit 1; }
          tar czf - codegen/windows/generated codegen/linux/generated codegen/android/generated \
              codegen/windows-eu/generated codegen/linux-eu/generated codegen/android-eu/generated \
            | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SOAL_ARTIFACT_KEY -out codegen.tar.gz.enc

      - name: Save codegen
        if: steps.cached.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: codegen.tar.gz.enc
          key: ${{ steps.key.outputs.key }}

      - name: Upload codegen
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: codegen
          path: codegen.tar.gz.enc
          if-no-files-found: error
          retention-days: 1

      - name: Keep codegen for later runs
        if: >-
          steps.earlier.outputs.id == '' ||
          (steps.cached.outputs.cache-hit != 'true' && steps.reused.outputs.found != 'true')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.key.outputs.key }}
          path: codegen.tar.gz.enc
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  windows:
    name: windows
    environment: ci
    needs: codegen
    runs-on: windows-2025
    steps:
      # Dolphin's SPIRV-Cross submodule has test files whose paths pass Windows' 260-character limit.
      # The runner's git also turns LF into CRLF on checkout, which breaks patches/ against the
      # submodules' files (the .bat files keep CRLF through .gitattributes).
      - name: Long paths, no line-ending conversion
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Apply patches
        shell: bash
        run: tools/apply-patches.sh

      - name: Download codegen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen

      - name: Decrypt codegen
        shell: bash
        env:
          SOAL_ARTIFACT_KEY: ${{ secrets.SOAL_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SOAL_ARTIFACT_KEY -in codegen.tar.gz.enc | tar xzf -
          rm codegen.tar.gz.enc

      # Not cached: the download, checksum and extract take under a minute, and saving the
      # extracted tree to the cache took three (2026-10-17 run)
      - name: Download LLVM ${{ env.LLVM_VERSION }}
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          echo "$LLVM_WINDOWS_SHA256  $RUNNER_TEMP/llvm.tar.xz" | sha256sum -c --quiet -
          # --force-local: GNU tar would read the "D:" of D:\a\_temp as a remote host
          mkdir -p /c/llvm && tar --force-local -xf "$RUNNER_TEMP/llvm.tar.xz" -C /c/llvm

      - name: Configure Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Build the module
        shell: cmd
        run: |
          set LLVM_ROOT=C:\llvm\clang+llvm-%LLVM_VERSION%-x86_64-pc-windows-msvc
          set MODULE_TABLES_INC=%CD%\codegen\windows\generated\module_tables.inc
          call tools\module-win.bat %CD%\codegen\windows\generated %CD%\build\module || exit /b 1
          set GAME_ID=GEAP8P
          set MODULE_TABLES_INC=%CD%\codegen\windows-eu\generated\module_tables.inc
          call tools\module-win.bat %CD%\codegen\windows-eu\generated %CD%\build\module-eu || exit /b 1

      - name: Build and package the launcher and runner
        shell: cmd
        env:
          VNAME: ${{ inputs.vname }}
        run: |
          if "%VNAME%"=="" (set VERSION=dev-%GITHUB_SHA:~0,7%) else (set VERSION=v%VNAME%)
          call tools\build-release-win.bat configure || exit /b 1
          call tools\build-release-win.bat build || exit /b 1
          call tools\build-release-win.bat package build\module\gGEAE8P_recomp.dll build\module-eu\gGEAP8P_recomp.dll %VERSION% || exit /b 1

      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-${{ github.sha }}
          path: build/SkiesOfArcadiaLegends-*-windows.zip*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Built on the oldest supported Ubuntu LTS runner so the binaries run on older glibc too
  linux:
    name: linux
    environment: ci
    needs: codegen
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Apply patches
        run: tools/apply-patches.sh

      - name: Download codegen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen

      - name: Decrypt codegen
        shell: bash  # -o pipefail
        env:
          SOAL_ARTIFACT_KEY: ${{ secrets.SOAL_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SOAL_ARTIFACT_KEY -in codegen.tar.gz.enc | tar xzf -
          rm codegen.tar.gz.enc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build build-essential pkg-config cmake \
            libevdev-dev libudev-dev libgtk-3-dev libsystemd-dev \
            libbluetooth-dev libasound2-dev libpulse-dev libgl1-mesa-dev libegl-dev \
            libxrandr-dev libxi-dev

      - name: Build the module
        run: |
          MODULE_TABLES_INC=codegen/linux/generated/module_tables.inc \
            tools/module-linux.sh codegen/linux/generated build/module-linux
          GAME_ID=GEAP8P MODULE_TABLES_INC=codegen/linux-eu/generated/module_tables.inc \
            tools/module-linux.sh codegen/linux-eu/generated build/module-linux-eu

      - name: Build and package the launcher and runner
        env:
          VNAME: ${{ inputs.vname }}
        run: |
          if [ -z "$VNAME" ]; then VERSION=dev-${GITHUB_SHA::7}; else VERSION=v$VNAME; fi
          tools/build-release-linux.sh configure
          tools/build-release-linux.sh build
          tools/build-release-linux.sh package build/module-linux/gGEAE8P_recomp.so \
            build/module-linux-eu/gGEAP8P_recomp.so "$VERSION"

      - name: Upload build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-${{ github.sha }}
          path: build/SkiesOfArcadiaLegends-*-linux.tar.gz*
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The native game module, from the generated code. Gradle doesn't run here: this job holds the
  # decrypted code and the key, so it runs only the NDK (Google's, through sdkmanager), CMake and Ninja.
  # The module it uploads is the one the APK ships.
  android-module:
    name: android-module
    environment: ci
    needs: codegen
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Apply patches
        run: tools/apply-patches.sh

      - name: Download codegen
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codegen

      - name: Decrypt codegen
        shell: bash  # -o pipefail
        env:
          SOAL_ARTIFACT_KEY: ${{ secrets.SOAL_ARTIFACT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SOAL_ARTIFACT_KEY -in codegen.tar.gz.enc | tar xzf -
          rm codegen.tar.gz.enc

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools  # the default also asks for 'tools', which the SDK dropped

      - name: Install the pinned NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sudo apt-get install -y ninja-build

      - name: Build the module
        run: |
          NAME=ci PREGEN=codegen/android PREGEN_EU=codegen/android-eu MODULE_ONLY=1 \
            NDK=$ANDROID_HOME/ndk/29.0.14206865 tools/android-ws-build.sh

      - name: Upload the module
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-module-${{ github.sha }}
          path: build/android/jniLibs-ci
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # The APK around that module. Gradle, its plugins and the build's dependencies (downloaded, not
  # hash-pinned) run here, so this job gets no secrets and never sees the generated code.
  android:
    name: android
    needs: android-module
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Apply patches
        run: tools/apply-patches.sh

      - name: Download the module
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-module-${{ github.sha }}
          path: android-module

      # SDL's sample android-project carries a wrapper jar that isn't a released Gradle build. Nothing
      # here runs it (the app builds with Source/Android's wrapper, validated next), so it goes
      # rather than being allow-listed.
      - name: Remove an unused Gradle wrapper
        run: rm lib/ModernGekko/vendor/dolphin/Externals/SDL/SDL/android-project/gradle/wrapper/gradle-wrapper.jar

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools  # the default also asks for 'tools', which the SDK dropped

      - name: Install the pinned NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          sudo apt-get install -y ninja-build

      # Release mode builds the APK unsigned: Gradle, its plugins and the build's dependencies run
      # here, so the signing secrets don't. The android-sign job signs it.
      - name: Build the APK
        env:
          RELEASE: ${{ (inputs.release || inputs.unsigned_release) && '1' || '0' }}
          VERSION: ${{ inputs.vname }}
        run: |
          BRAND=1 SIGN=0 NAME=ci JNILIBS=android-module NDK=$ANDROID_HOME/ndk/29.0.14206865 tools/android-ws-build.sh
          ls -la build/android/apk/

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-${{ (inputs.release || inputs.unsigned_release) && 'unsigned' || 'debug' }}-${{ github.sha }}
          path: build/android/apk/*.apk
          if-no-files-found: error
          retention-days: ${{ inputs.release && 1 || 7 }}

  # ---------------------------------------------------------------------------
  # Release mode only: sign the APK with the release key. Nothing runs here but the runner image's
  # Android SDK (zipalign, apksigner) and JDK (keytool), through tools/sign-apk.sh, which refuses an
  # APK not signed by exactly the release key (and the pinned one, release/android-signer.sha256).
  android-sign:
    name: android-sign
    environment: release
    if: ${{ inputs.release }}
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the signing script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          sparse-checkout: |
            tools/sign-apk.sh
            release/android-signer.sha256
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download the unsigned APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-unsigned-${{ github.sha }}
          path: unsigned

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set -- cannot sign a release."; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Sign
        env:
          SKIES_KEYSTORE: ${{ runner.temp }}/release.jks
          SKIES_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SKIES_STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SKIES_KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          IN=(unsigned/*-android-unsigned.apk)
          [ ${#IN[@]} = 1 ] || { echo "::error::expected one unsigned APK, found ${#IN[@]}"; exit 1; }
          mkdir signed
          OUT="signed/$(basename "${IN[0]}" -unsigned.apk).apk"
          tools/sign-apk.sh "${IN[0]}" "$OUT"
          ls -la signed

      - name: Clean up signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-release-${{ github.sha }}
          path: signed/*.apk
          if-no-files-found: error
          retention-days: 7

# The emulator-free host for one platform, called by validate.yml once per platform (so each platform's release
# job waits for its own build only):
#   dawn: Dawn with patches/dawn/ (MSAA 2x / 8x, the Vulkan swapchain check) as the package Aurora takes
#         (tools/ci-dawn.sh), cached by the patches, the scripts and Aurora's pinned Dawn; artifact dawn-<target>
#   host: the standalone built against it (tools/build-standalone-release.*), artifact standalone-<target> (a
#         tarball: artifacts drop the executable bit); Linux in the release's Ubuntu 22.04 container. Android's
#         host is built inside the APK build (validate.yml android), which takes dawn-android.
# Neither job has secrets or the game's code, so a workflow_dispatch run of validate on any branch builds and
# links both. In a release (release: true) a missing patched Dawn fails the job; otherwise the host is built
# against the stock prebuilt (anti-aliasing Off / 4x only) with a warning in the run's summary.
name: standalone-host

on:
  workflow_call:
    inputs:
      target:  # linux | android | darwin | windows
        type: string
        required: true
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dawn:
    name: dawn (${{ inputs.target }})
    runs-on: ${{ inputs.target == 'darwin' && 'macos-15' || inputs.target == 'windows' && 'windows-2025' || 'ubuntu-24.04' }}
    timeout-minutes: 240
    env:
      PACKAGE: ${{ inputs.target == 'linux' && 'dawn-linux-x86_64.tar.gz' || inputs.target == 'android' && 'dawn-android-aarch64.tar.gz' || inputs.target == 'darwin' && 'dawn-darwin-arm64.tar.gz' || 'dawn-windows-amd64.tar.gz' }}
    steps:
      - name: Long paths, no line-ending conversion
        if: inputs.target == 'windows'
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Only what the patches need (Aurora's CMakeLists.txt names the Dawn version)
      - name: Submodules (ModernGekko, RecompCore, DolRecomp) and patches
        continue-on-error: ${{ !inputs.release }}
        shell: bash
        run: |
          git submodule update --init --depth 1 lib/ModernGekko
          git -C lib/ModernGekko submodule update --init --depth 1 vendor/dolphin
          git -C lib/ModernGekko/vendor/dolphin submodule update --init --depth 1 DolRecomp
          tools/apply-patches.sh

      - name: Cache
        id: cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dawn-package/${{ env.PACKAGE }}
          key: dawn-${{ inputs.target }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('patches/dawn/*.patch', 'tools/build-dawn-package.sh', 'tools/build-dawn-package.bat', 'tools/ci-dawn.sh', '.github/workflows/standalone-host.yml', 'lib/ModernGekko/vendor/dolphin/GXRuntime/graphics/aurora/CMakeLists.txt') }}

      - name: Build tools (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && inputs.target == 'linux'
        continue-on-error: ${{ !inputs.release }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build pkg-config libx11-xcb-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev libxkbcommon-dev libgl-dev

      - name: Build tools (Android, macOS)
        if: steps.cache.outputs.cache-hit != 'true' && (inputs.target == 'android' || inputs.target == 'darwin')
        continue-on-error: ${{ !inputs.release }}
        shell: bash
        run: |
          if [ "${{ inputs.target }}" = android ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
          else
            brew install ninja || true
          fi

      - name: MSVC (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && inputs.target == 'windows'
        continue-on-error: ${{ !inputs.release }}
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build
        id: build
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: ${{ !inputs.release }}
        shell: bash
        run: |
          if [ "${{ inputs.target }}" = android ]; then export ANDROID_NDK="$ANDROID_HOME/ndk/29.0.14206865"; fi
          tools/ci-dawn.sh ${{ inputs.target }} build/dawn-package
          test -f "build/dawn-package/$PACKAGE"

      - name: Save the cache
        if: steps.cache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/dawn-package/${{ env.PACKAGE }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Upload
        if: hashFiles(format('build/dawn-package/{0}', env.PACKAGE)) != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dawn-${{ inputs.target }}
          path: build/dawn-package/${{ env.PACKAGE }}
          retention-days: 7

      - name: Report a missing package
        if: hashFiles(format('build/dawn-package/{0}', env.PACKAGE)) == ''
        shell: bash
        run: |
          if [ "${{ inputs.release }}" = true ]; then
            echo "::error title=No patched Dawn for ${{ inputs.target }}::a release needs it (anti-aliasing 2x / 8x); see this job's Build step"
            exit 1
          fi
          echo "::warning title=No patched Dawn for ${{ inputs.target }}::the ${{ inputs.target }} host is built on the stock Dawn package (anti-aliasing Off / 4x only); see this job's Build step"

  # Linux: in the release's Ubuntu 22.04 container (glibc 2.35; GCC 13's libstdc++ linked in statically)
  host-linux:
    name: host (linux)
    if: ${{ !cancelled() && inputs.target == 'linux' }}
    needs: dawn
    runs-on: ubuntu-24.04
    container:
      # by digest, like the actions (review D31): 22.04's multi-arch index as of 2026-10-22, as validate.yml's linux
      image: ubuntu:22.04@sha256:0a9887931b0e38af2e3487ed39e29436b0535c4f3f52e57745baaf79d1898956
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Aurora needs CMake 3.25+ (pip's), SDL3's X11 parts XTest and friends; Dawn needs GCC 13's libstdc++ (the
      # toolchain PPA)
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl file xz-utils ninja-build \
            build-essential pkg-config python3 python3-pip software-properties-common gpg-agent \
            libevdev-dev libudev-dev libsystemd-dev libasound2-dev libpulse-dev libgl1-mesa-dev libegl-dev \
            libxrandr-dev libxi-dev libx11-dev libxext-dev libxcursor-dev libxss-dev libxtst-dev \
            libxinerama-dev libxfixes-dev libxkbcommon-dev libwayland-dev libdbus-1-dev
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          apt-get update
          apt-get install -y --no-install-recommends gcc-13 g++-13
          python3 -m pip install --target /opt/cmake-pip cmake==3.31.6
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Apply patches
        run: tools/apply-patches.sh

      - name: Patched Dawn
        continue-on-error: ${{ !inputs.release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawn-linux
          path: build/dawn-package

      - name: Build
        run: |
          if [ -f build/dawn-package/dawn-linux-x86_64.tar.gz ]; then
            export DAWN_PACKAGE=$PWD/build/dawn-package/dawn-linux-x86_64.tar.gz
          elif [ "${{ inputs.release }}" = true ]; then
            echo "::error::a release needs the patched Dawn"; exit 1
          fi
          CC=gcc-13 CXX=g++-13 PATH=/opt/cmake-pip/bin:$PATH PYTHONPATH=/opt/cmake-pip \
            tools/build-standalone-release.sh build/standalone-release
          tar -czf standalone-linux.tar.gz -C build/standalone-release skies-standalone

      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-linux
          path: standalone-linux.tar.gz
          if-no-files-found: error
          retention-days: 7

  host:
    name: host (${{ inputs.target }})
    if: ${{ !cancelled() && (inputs.target == 'darwin' || inputs.target == 'windows') }}
    needs: dawn
    runs-on: ${{ inputs.target == 'darwin' && 'macos-15' || 'windows-2025' }}
    steps:
      - name: Long paths, no line-ending conversion
        if: inputs.target == 'windows'
        run: |
          git config --system core.longpaths true
          git config --system core.autocrlf false

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
          persist-credentials: false

      - name: Apply patches
        shell: bash
        run: tools/apply-patches.sh

      - name: Ninja and Xcode 26 (macOS)
        if: inputs.target == 'darwin'
        run: |
          brew install ninja
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          clang++ --version

      - name: MSVC (Windows)
        if: inputs.target == 'windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Patched Dawn
        continue-on-error: ${{ !inputs.release }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dawn-${{ inputs.target }}
          path: build/dawn-package

      - name: Build (macOS)
        if: inputs.target == 'darwin'
        run: |
          if [ -f build/dawn-package/dawn-darwin-arm64.tar.gz ]; then
            export DAWN_PACKAGE=$PWD/build/dawn-package/dawn-darwin-arm64.tar.gz
          elif [ "${{ inputs.release }}" = true ]; then
            echo "::error::a release needs the patched Dawn"; exit 1
          fi
          tools/build-standalone-release.sh build/standalone-release
          tar -czf standalone-darwin.tar.gz -C build/standalone-release skies-standalone

      - name: Build (Windows)
        if: inputs.target == 'windows'
        shell: cmd
        run: |
          if exist build\dawn-package\dawn-windows-amd64.tar.gz (
            set "DAWN_PACKAGE=%CD%\build\dawn-package\dawn-windows-amd64.tar.gz"
          ) else if "${{ inputs.release }}"=="true" (
            echo ::error::a release needs the patched Dawn
            exit /b 1
          )
          call tools\build-standalone-release.bat build\standalone-release || exit /b 1
          mkdir host-out || exit /b 1
          copy /y build\standalone-release\skies-standalone.exe host-out\ >nul || exit /b 1
          copy /y build\standalone-release\*.dll host-out\ >nul || exit /b 1
          "%SystemRoot%\System32\tar.exe" -czf standalone-windows.tar.gz -C host-out . || exit /b 1

      - name: Upload
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: standalone-${{ inputs.target }}
          path: standalone-${{ inputs.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

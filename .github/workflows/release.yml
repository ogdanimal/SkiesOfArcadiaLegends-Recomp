# Tagged release: vMAJOR.MINOR.PATCH[-suffix] on a commit on main -> the Windows zip, the Linux
# tar.gz and AppImage, the macOS app zip and the signed Android APK on a GitHub Release (a -suffix
# tag is a prerelease).
#
# Triggers ONLY on tag pushes, so fork PRs cannot reach the game DOL or the signing key. The builds
# are validate.yml's own steps (workflow_call), not a copy. Nothing published contains game data:
# players supply their own disc, which the launcher imports and patches. The codegen artifact never
# leaves the workflow, and the publish job refuses any package holding a disc image, a DOL or
# generated code.

name: release

on:
  push:
    tags:
      - 'v*'
  # By hand ON THE TAG (gh workflow run release.yml --ref vX.Y.Z), for when the tag push didn't start
  # a run (seen on this private repo, 2026-10-13: pushes recorded, no runs). Any other ref fails the
  # guard below: the ref name must be a version tag and its commit must be on main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  guard:
    name: guard + version
    runs-on: ubuntu-24.04
    outputs:
      vname: ${{ steps.ver.outputs.vname }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # Any v* tag on any commit would otherwise publish a signed release.
      - name: Guard -- tag commit must be on main
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::${GITHUB_REF} is not a tag; run this on the release tag."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; refusing to publish."
            exit 1
          fi

      - name: Derive version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Letters, digits and dots only after the dash: the value flows into scripts and file names.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]; refusing to release."
            exit 1
          fi
          VNAME="${TAG#v}"
          if [ "$VNAME" != "${VNAME%%-*}" ]; then PRERELEASE=true; else PRERELEASE=false; fi
          { echo "vname=$VNAME"; echo "prerelease=$PRERELEASE"; } >> "$GITHUB_OUTPUT"
          echo "Release $TAG -> versionName=$VNAME prerelease=$PRERELEASE"

  # ---------------------------------------------------------------------------
  build:
    name: build
    needs: guard
    permissions:
      contents: read
      actions: read   # validate's codegen job reuses the codegen of the validated commit
    uses: ./.github/workflows/validate.yml
    with:
      release: true
      vname: ${{ needs.guard.outputs.vname }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [guard, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # to create the GitHub Release
    env:
      VNAME: ${{ needs.guard.outputs.vname }}
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-${{ github.sha }}
          path: out

      - name: Download Linux build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-${{ github.sha }}
          path: out

      - name: Download macOS build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-${{ github.sha }}
          path: out

      - name: Download Android build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-${{ github.sha }}
          path: out

      # The game patch, for the patched DOL's hash (it changes with every game patch build, so it is
      # read from the patch, not written here)
      - name: Checkout the DOL patch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: src
          sparse-checkout: |
            release/skies-widescreen.dolpatch
            release/skies-widescreen-eu.dolpatch
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # The builds aren't supposed to hold any of this; check anyway, because a release can't be
      # un-downloaded. Game data = a disc image, a DOL (by name, or by the hash of the original or
      # of the patched one the launcher makes), the disc's banner, or DolRecomp output; archives
      # inside the packages are opened and checked too. The recompiled modules (g<disc ID>_recomp.dll /
      # .so / .dylib / lib...so, one each for GEAE8P and GEAP8P) are translated game code by design, as in the N64
      # recomps: they are the game-derived files allowed, by name.
      - name: Refuse anything game-shaped
        run: |
          set -euo pipefail
          GAME='\.(iso|gcm|rvz|gcz|wia|ciso|wbfs|dol|elf|bnr|o|obj)$|(^|/)generated(/|$)|module_tables\.inc$|(^|/)chunks/'
          # Each game's original DOL (pinned here) and the patched one its .dolpatch makes
          DOLS=""
          for pair in skies-widescreen:87c240acb746c5a09e95dd84021f78643eaa6721d8edc96ed87d3b6b3bcbae54 \
                      skies-widescreen-eu:d0e9fc91bd477d5cf1da24261de4c606893979ada0a7fef3c741c0c2470d96c3; do
            PATCH=src/release/${pair%%:*}.dolpatch
            ORIGINAL=$(sed -n 's/^input-sha256 //p' "$PATCH"); PATCHED=$(sed -n 's/^output-sha256 //p' "$PATCH")
            [ "$ORIGINAL" = "${pair#*:}" ] && [ ${#PATCHED} = 64 ] ||
              { echo "::error::Can't read the DOL hashes from $PATCH."; exit 1; }
            DOLS="$DOLS${DOLS:+|}$ORIGINAL|$PATCHED"
          done
          ls -la out
          # Unpack every package, then any archive inside, a few levels deep
          mkdir x && for p in out/*.zip out/*.apk; do unzip -q -o "$p" -d "x/$(basename "$p")"; done
          for p in out/*.tar.gz; do mkdir "x/$(basename "$p")" && tar -xzf "$p" -C "x/$(basename "$p")"; done
          # The AppImage's own runtime unpacks it (squashfs-root), no FUSE needed
          for p in out/*.AppImage; do
            mkdir "x/$(basename "$p")" && chmod +x "$p"
            (cd "x/$(basename "$p")" && "$GITHUB_WORKSPACE/$p" --appimage-extract > /dev/null)
          done
          for level in 1 2 3; do
            find x -type f \( -iname '*.zip' -o -iname '*.apk' -o -iname '*.jar' -o -iname '*.aar' \) -print0 > nested
            [ -s nested ] || break
            while IFS= read -r -d '' a; do unzip -q -o "$a" -d "$a.d" && rm "$a"; done < nested
          done
          find x -type f \( -iname '*.tar' -o -iname '*.tar.*' -o -iname '*.tgz' -o -iname '*.7z' -o -iname '*.rar' \) > other
          if [ -s other ]; then cat other; echo "::error::A package contains an archive this check can't open."; exit 1; fi
          (cd x && find . -type f | sed 's#^\./##') > list.txt
          if grep -i -E "$GAME" list.txt; then
            echo "::error::A package contains a disc image, a DOL or generated code."; exit 1
          fi
          # By content: no file may be the original or the patched DOL
          find x -type f -size +1M -exec sha256sum {} + > sums.txt
          if grep -E "^($DOLS) " sums.txt; then
            echo "::error::A package contains the game's DOL."; exit 1
          fi
          # The allowed modules (one per game), and only where they belong
          for m in '-windows\.zip/[^/]+/gGEAE8P_recomp\.dll' '-linux\.tar\.gz/[^/]+/gGEAE8P_recomp\.so' \
                   '-android\.apk/lib/arm64-v8a/libgGEAE8P_recomp\.so' \
                   '-x86_64\.AppImage/squashfs-root/usr/bin/gGEAE8P_recomp\.so' \
                   '-macos\.zip/[^/]+/Skies of Arcadia Legends\.app/Contents/MacOS/gGEAE8P_recomp\.dylib' \
                   '-windows\.zip/[^/]+/gGEAP8P_recomp\.dll' '-linux\.tar\.gz/[^/]+/gGEAP8P_recomp\.so' \
                   '-android\.apk/lib/arm64-v8a/libgGEAP8P_recomp\.so' \
                   '-x86_64\.AppImage/squashfs-root/usr/bin/gGEAP8P_recomp\.so' \
                   '-macos\.zip/[^/]+/Skies of Arcadia Legends\.app/Contents/MacOS/gGEAP8P_recomp\.dylib'; do
            grep -qE -e "$m\$" list.txt || { echo "::error::A package is missing its recompiled module ($m)."; exit 1; }
          done
          rm -rf x list.txt sums.txt nested other src
          echo "No disc image, DOL or generated code in any package (module allowed by name)."

      - name: Checksums
        run: |
          cd out
          rm -f *.sha256
          sha256sum *.zip *.tar.gz *.AppImage *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
        run: |
          FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          cat > notes.md <<'EOF'
          **You need your own Skies of Arcadia Legends disc (GameCube, USA `GEAE8P` or European
          `GEAP8P`)** as RVZ, ISO, GCM, GCZ, WIA or CISO. Nothing here contains game data: the launcher imports your disc and
          patches it.

          - **Windows** (64-bit Windows 10 / 11): unzip, run `Skies of Arcadia Legends.exe`, choose
            Select Disc.
          - **Linux** (x86_64): the `.AppImage` is one file with the libraries it needs inside: make
            it executable (`chmod +x`, or the file's Properties) and run it. Or extract the `.tar.gz`
            and run `./SkiesOfArcadiaLegends` from inside the folder. Then choose Select Disc.
          - **macOS** (Apple Silicon, macOS 13+): unzip and open Skies of Arcadia Legends. The app
            isn't notarized: the first time, macOS says it can't check it; allow it in System
            Settings → Privacy & Security (Open Anyway). Then choose Select Disc.
          - **Android** (arm64, Android 7+): install the APK, open Skies of Arcadia Legends and pick
            your disc image.

          Known issue: changing the battle speed while a round plays out can freeze the battle;
          change it while choosing commands. See README.md in the download for controls and settings.
          EOF
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Skies of Arcadia Legends: Recompiled $GITHUB_REF_NAME" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --verify-tag \
            "${FLAGS[@]}"
